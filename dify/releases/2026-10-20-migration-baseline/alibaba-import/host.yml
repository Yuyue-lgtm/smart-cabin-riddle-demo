                    result.update(ai_reply_text=reply, intent="game_related_chat", reply_mode="chat_only", covered_fact_keys=[],
                                  game_status=game.get("status"), is_correct=False, answer=None, passenger_action=None,
                                  strategy="soft_response", target_seat=None, applied_knowhow_ids=[], reason_codes=["explicit_game_control"])
                    result["execution"] = {"kind": "plan", "actions": actions, "timing": {"owner": "frontend"}}
                    result["ui_change"] = {"show_answer": False, "animation": "speak", "host_emotion": "normal"}
                    result["decision_trace"].update(guard_status="passed", matched_rule="explicit_game_control",
                        action_authorization="explicit_game_control", decision="明确游戏暂停/继续请求；前端保留进度并检查安全状态后执行")
                    return {"workflow_output": encode(result)}
                if re.search(r"它|谜底|答案|假如|如果|假设|[“”\"‘’]|(?:不要|别|先别).{0,4}(?:关闭|关掉|停止|暂停|打开|开启|启动)", line):
                    result["execution"]["actions"] = []
                game = obj(current.get("game"))
                if help_request(line) and game.get("status") == "playing":
                    answer = text(game.get("current_answer"), 100)
                    clues = [text(clue, 160) for clue in items(game.get("public_clues"))
                             if isinstance(clue, str) and text(clue, 160) and (not answer or answer not in clue)]
                    clue = next((clue for clue in reversed(clues) if len(clue) <= 54), "")
                    result.update(ai_reply_text="已公开：" + clue if clue else "目前没有可重述的公开线索，可以继续问是或否问题。",
                                  intent="game_related_chat", reply_mode="chat_only", covered_fact_keys=[],
                                  strategy="soft_response", target_seat=None, applied_knowhow_ids=[], reason_codes=["public_clue_recap"])
                    result["execution"]["actions"] = []
                    result["decision_trace"].update(guard_status="passed", hint_blocked=True, matched_rule="public_clue_recap",
                        decision="仅重述前端已公开线索，不新增事实或揭晓答案")
                    return {"workflow_output": encode(result)}
                normalized = parse(model_result)
                model = model_json(normalized.get("canonical_text", director_text))
                proposed = items(model.get("execution_actions"))
                lights = [action for action in proposed if obj(action).get("type") == "cabin.set_zone_light"]
                authorization = zone_light_authorization(line, selected_seat(current))
                request_like = not re.search(r"它|谜底|答案|假如|如果|假设|[“”\"‘’]|不要|先别|别关|别开", line)
                refusal = None
                if request_like:
                    if re.search(r"我.{0,3}(?:冷|热)|(?:调|开|关|升|降).{0,8}(?:空调|温度)", line):
                        refusal = "我目前不能调节空调，你可以手动调整；游戏进度会保留。"
                    elif re.search(r"还有多久到|多久能到|什么时候到|几分钟到", line):
                        refusal = "我目前无法查询到达时间，你可以查看行程信息；这题的进度还在。"
                    elif re.search(r"换.{0,4}主题|切换.{0,4}主题", line):
                        refusal = "我目前不能切换游戏主题，我们先保留当前这题。"
                    elif re.search(r"(?:分区|我这边).{0,8}(?:音量|声音).{0,5}(?:调|大|小|关)|(?:调|关闭).{0,8}分区音量", line):
                        refusal = "我目前不能单独调节分区音量，可以帮你开关游戏背景音乐。"
                    elif re.search(r"(?:关掉|关闭|关一下|关了|关上|打开|开启|开一下|开了).{0,12}灯|灯.{0,8}(?:关掉|关闭|关一下|关了|关上|打开|开启|开一下|开了)", line) and not authorization:
                        refusal = "你想调整哪个分区的灯光？可以说副驾、主驾或后排左、后排右。"
                if refusal:
                    result.update(ai_reply_text=refusal, intent="game_related_chat", reply_mode="chat_only", covered_fact_keys=[],
                                  strategy="soft_response", target_seat=None, applied_knowhow_ids=[], reason_codes=["capability_boundary"])
                    result["execution"]["actions"] = []
                    result["decision_trace"].update(guard_status="passed", decision="能力边界或目标不明确，不执行设备动作并保留游戏进度")
                    return {"workflow_output": encode(result)}
                unsupported = [action for action in proposed if obj(action).get("type") not in {"music.set_enabled", "cabin.set_zone_light"}]
                if unsupported or lights and (len(proposed) != 1 or lights != [authorization]):
                    result["execution"]["actions"] = []
                    result.update(ai_reply_text="", intent="fallback", covered_fact_keys=[])
                    result["decision_trace"].update(guard_status="control_not_authorized", guard_reason_codes=["control_not_authorized"])
                elif lights and result["decision_trace"].get("guard_status") == "passed":
                    result["execution"]["actions"] = lights
                    result.update(intent="game_related_chat", reply_mode="chat_only", covered_fact_keys=[])
                    result["decision_trace"].update(action_authorization="explicit_zone_light_command", decision="明确分区灯光请求，等待前端验证执行")
                return {"workflow_output": encode(result)}

            _preflight_dialogue_guard = main


            import json

            import re



            def output_object(value):
                if isinstance(value, dict):
                    return value
                if isinstance(value, str):
                    try:
                        parsed = json.loads(value)
                        return parsed if isinstance(parsed, dict) else {}
                    except ValueError:
                        pass
                return {}


            def output_schema_errors(value, schema, path="output"):
                kinds = {"object": dict, "array": list, "string": str, "null": type(None), "boolean": bool}
                expected = schema.get("type", [])
                expected = [expected] if isinstance(expected, str) else expected
                if expected and not any(isinstance(value, kinds[kind]) for kind in expected):
                    return [path + ":invalid_type"]
                if "enum" in schema and value not in schema["enum"]:
                    return [path + ":invalid_enum"]
                errors = []
                if isinstance(value, dict):
                    fields = schema.get("properties", {})
                    errors += [path + "." + name + ":missing" for name in schema.get("required", []) if name not in value]
                    if schema.get("additionalProperties") is False:
                        errors += [path + "." + name + ":unknown" for name in value if name not in fields]
                    for name, field in fields.items():
                        if name in value:
                            errors += output_schema_errors(value[name], field, path + "." + name)
                elif isinstance(value, list):
                    for index, item in enumerate(value):
                        errors += output_schema_errors(item, schema.get("items", {}), path + "[" + str(index) + "]")
                return errors[:20]


            def inspect_dialogue_output(director_text, director_structured, payload="", director_context=""):
                structured = output_object(director_structured)
                raw = director_text if isinstance(director_text, str) else ""
                final = re.sub(r"<think\b[^>]*>.*?</think\s*>", "", raw, flags=re.I | re.S).strip()
                if re.search(r"<think\b", final, re.I):
                    final = ""
                final = re.sub(r"^```(?:json)?\s*|\s*```$", "", final, flags=re.I).strip()
                parsed_text = output_object(final)
                reasons = []
                for source, value in (("structured_output", structured), ("text", parsed_text)):
                    if not value:
                        continue
                    errors = output_schema_errors(value, json.loads(DIALOGUE_OUTPUT_SCHEMA))
                    reply = value.get("ai_reply_text")
                    if not isinstance(reply, str) or not reply.strip():
                        errors.append("missing_model_reply")
                    elif len(reply.strip()) > 60 or re.search(r"</?think\b", reply, re.I):
                        errors.append("invalid_model_reply")
                    preflight = globals().get("_preflight_dialogue_guard")
                    if not errors and payload and director_context and callable(preflight):
                        guarded = output_object(preflight(json.dumps(value, ensure_ascii=False), payload, director_context).get("workflow_output"))
                        trace = guarded.get("decision_trace") or {}
                        if trace.get("guard_status") not in ("passed", "hint_blocked"):
                            debug = guarded.get("debug") or {}
                            codes = debug.get("validation_errors", []) + debug.get("fallback_reason_codes", []) + trace.get("guard_reason_codes", [])
                            errors += ["content_guard:" + str(code) for code in codes[:12]] or ["content_guard:reply_rejected"]
                    if not errors:
                        return value, {"source": source, "status": "valid", "reason_codes": reasons}
                    reasons += [source + ":" + error for error in errors]
                if not final and re.search(r"<think\b", raw, re.I):
                    reasons.append("think_only_output")
                elif not structured and (not final or final == "{}"):
                    reasons.append("empty_model_output")
                elif not parsed_text and final:
                    reasons.append("invalid_model_json")
                if not reasons:
                    reasons.append("invalid_model_json")
                return {}, {"source": "none", "status": "invalid", "reason_codes": list(dict.fromkeys(reasons))}


            def normalize_dialogue_output(director_text, director_structured, previous_result=None, payload="",
            director_context=""):
                value, attempt = inspect_dialogue_output(director_text, director_structured, payload, director_context)
                previous = output_object(previous_result)
                attempts = previous.get("attempts", [])
                attempts = attempts[:1] if isinstance(attempts, list) else []
                attempt["attempt"] = len(attempts) + 1
                attempts = attempts + [attempt]
                result = {"canonical_text": json.dumps(value, ensure_ascii=False), "attempts": attempts,
                          "status": "valid" if value else "retry_exhausted" if previous else "retry_needed"}
                return json.dumps(result, ensure_ascii=False, separators=(",", ":")), not bool(value)


            def main(director_text: str, director_structured: dict = None, payload: str = "", director_context: str =
            "") -> dict:
                result, retry = normalize_dialogue_output(director_text, director_structured, payload=payload, director_context=director_context)
                return {"model_result": result, "needs_retry": retry}

            DIALOGUE_OUTPUT_SCHEMA = "{\n  \"type\": \"object\",\n  \"additionalProperties\": false,\n  \"properties\":
            {\n    \"intent\": { \"type\": \"string\", \"enum\": [\"answer_question\", \"guess\", \"smalltalk\",
            \"game_related_chat\", \"repeat_question\", \"event\", \"fallback\"] },\n    \"reply_mode\": { \"type\":
