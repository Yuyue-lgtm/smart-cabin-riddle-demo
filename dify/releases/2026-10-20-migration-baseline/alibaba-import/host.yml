            },\n    \"covered_fact_keys\": { \"type\": \"array\", \"items\": { \"type\": \"string\" }
            },\n    \"execution_actions\": {\n      \"type\": \"array\",\n      \"items\": {\n        \"type\":
            \"object\", \"additionalProperties\": false,\n        \"properties\": {\n          \"type\": { \"type\":
            \"string\", \"enum\": [\"music.set_enabled\", \"cabin.set_zone_light\", \"cabin.apply_sleep_comfort\",
            \"cabin.restore_sleep_comfort\", \"game.set_paused\"] },\n          \"paused\": { \"type\": \"boolean\"
            },\n          \"enabled\": { \"type\": \"boolean\" },\n          \"seat\": { \"type\": \"string\", \"enum\":
